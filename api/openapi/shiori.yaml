openapi: 3.1.0
info:
  title: Shiori API
  description: Shiori backend server API for media management and extraction.
  version: 1.0.0
servers:
  - url: /
    description: Current server
paths:
  /health/live:
    get:
      summary: Liveness probe
      operationId: getHealthLive
      tags:
        - Health
      responses:
        '200':
          description: Server is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: alive
                required:
                  - status

  /health/ready:
    get:
      summary: Readiness probe
      operationId: getHealthReady
      tags:
        - Health
      responses:
        '200':
          description: Server is ready to accept requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                required:
                  - status
        '503':
          description: Server is not ready
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/capabilities:
    get:
      summary: Get server capabilities
      operationId: getCapabilities
      tags:
        - System
      responses:
        '200':
          description: Server capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'

  /api/v1/media:
    get:
      summary: List library media
      operationId: listMedia
      tags:
        - Library
      responses:
        '200':
          description: A list of media items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Media'
    post:
      summary: Add a new media to the library
      operationId: createMedia
      tags:
        - Library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaCreateRequest'
      responses:
        '201':
          description: Media created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/media/{mediaId}:
    get:
      summary: Get media by ID
      operationId: getMedia
      tags:
        - Library
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The media item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '404':
          description: Media not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details for HTTP APIs
      properties:
        type:
          type: string
          format: uri
          default: "about:blank"
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
      required:
        - title
        - status

    Capability:
      type: object
      properties:
        name:
          type: string
        available:
          type: boolean
      required:
        - name
        - available

    CapabilitiesResponse:
      type: object
      properties:
        profile:
          type: string
          enum: [portable, docker]
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
      required:
        - profile
        - capabilities

    Media:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [manga, manhwa, comic, novel, anime, unknown]
        title:
          type: string
        alternative_titles:
          type: array
          items:
            type: string
        description:
          type: string
        cover_url:
          type: string
        authors:
          type: array
          items:
            type: string
        artists:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [ongoing, completed, hiatus, cancelled, unknown]
        genres:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - type
        - title
        - alternative_titles
        - authors
        - artists
        - status
        - genres
        - created_at
        - updated_at

    MediaCreateRequest:
      type: object
      properties:
        type:
          type: string
          enum: [manga, manhwa, comic, novel, anime, unknown]
        title:
          type: string
        alternative_titles:
          type: array
          items:
            type: string
        description:
          type: string
        cover_url:
          type: string
        authors:
          type: array
          items:
            type: string
        artists:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [ongoing, completed, hiatus, cancelled, unknown]
        genres:
          type: array
          items:
            type: string
      required:
        - type
        - title
