openapi: 3.1.0
info:
  title: Shiori API
  description: Shiori backend server API for media management and extraction.
  version: 1.0.0
servers:
  - url: /
    description: Current server
paths:
  /health/live:
    get:
      summary: Liveness probe
      operationId: getHealthLive
      tags:
        - Health
      responses:
        '200':
          description: Server is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: alive
                required:
                  - status

  /health/ready:
    get:
      summary: Readiness probe
      operationId: getHealthReady
      tags:
        - Health
      responses:
        '200':
          description: Server is ready to accept requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                required:
                  - status
        '503':
          description: Server is not ready
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/capabilities:
    get:
      summary: Get server capabilities
      operationId: getCapabilities
      tags:
        - System
      responses:
        '200':
          description: Server capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'

  /api/v1/media:
    get:
      summary: List library media
      operationId: listMedia
      tags:
        - Library
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A list of media items
          headers:
            X-Next-Cursor:
              $ref: '#/components/headers/NextCursor'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Media'
    post:
      summary: Add a new media to the library
      operationId: createMedia
      tags:
        - Library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaCreateRequest'
      responses:
        '201':
          description: Media created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/media/{mediaId}:
    get:
      summary: Get media by ID
      operationId: getMedia
      tags:
        - Library
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The media item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '404':
          description: Media not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/media/{mediaId}/chapters:
    get:
      summary: List chapters or episodes for a library item
      operationId: listMediaChapters
      tags: [Library]
      parameters:
        - name: mediaId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Reader entries; manga includes local image URLs and anime includes only a remote video URL
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Chapter' }

  /api/v1/chapters/{chapterId}:
    get:
      summary: Get one chapter or episode for reading/playback
      operationId: getChapter
      tags: [Library]
      parameters:
        - name: chapterId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Reader entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chapter' }
        '404':
          description: Chapter not found

  /api/v1/reader/assets/{assetPath}:
    get:
      summary: Read a stored manga page image
      operationId: getReaderAsset
      tags: [Library]
      parameters:
        - name: assetPath
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Stored image bytes
          content:
            image/*: {}
        '404':
          description: Image not found

  /api/v1/ai/models:
    get:
      summary: List AI models and their loaded status
      operationId: listAIModels
      tags:
        - AI
      responses:
        '200':
          description: A list of AI models configured in the server and their status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AIModel'

  /api/v1/ai/models/{modelKey}/load:
    post:
      summary: Load a specific AI model into memory (JIT)
      operationId: loadAIModel
      tags:
        - AI
      parameters:
        - name: modelKey
          in: path
          required: true
          schema:
            type: string
            enum: [tiny, default, quality]
      responses:
        '204':
          description: Model loaded successfully
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: LM Studio unavailable or failed to load
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/ai/models/{modelKey}/unload:
    post:
      summary: Unload a configured AI model from memory
      operationId: unloadAIModel
      tags: [AI]
      parameters:
        - $ref: '#/components/parameters/ModelKey'
      responses:
        '204': { description: Model unloaded or already unloaded }
        '502':
          description: LM Studio unavailable or failed to unload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/jobs/extract:
    post:
      summary: Enqueue an extraction job
      operationId: extractJob
      tags:
        - Jobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                target:
                  type: string
                  enum: [manga, anime]
                requires_login:
                  type: boolean
                  default: false
                  description: Explicitly asks for a human login before extraction. The backend never receives credentials.
                login_url:
                  type: string
                  format: uri
                  description: Login page opened in the same isolated persistent browser profile as the source URL. Required when requires_login is true.
              required:
                - url
                - target
              allOf:
                - if:
                    properties:
                      requires_login:
                        const: true
                    required: [requires_login]
                  then:
                    required: [login_url]
      responses:
        '202':
          description: Job enqueued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/jobs/{jobID}:
    get:
      summary: Get durable job status
      operationId: getJob
      tags: [Jobs]
      parameters: [{ $ref: '#/components/parameters/JobID' }]
      responses:
        '200':
          description: Current job state
          content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } }
        '404': { description: Job not found }
    delete:
      summary: Cooperatively cancel a queued or running job
      operationId: cancelJob
      tags: [Jobs]
      parameters: [{ $ref: '#/components/parameters/JobID' }]
      responses:
        '204': { description: Cancellation accepted }
        '404': { description: Job not found }
        '409': { description: Job is already in a terminal state }

  /api/v1/jobs/{jobID}/events:
    get:
      summary: Stream and replay job events
      description: Reconnect with Last-Event-ID or the after query parameter. Events have id, event and JSON data fields.
      operationId: streamJobEvents
      tags: [Jobs]
      parameters:
        - $ref: '#/components/parameters/JobID'
        - name: Last-Event-ID
          in: header
          schema: { type: string }
        - name: after
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: SSE events progress, challenge, done, error or cancelled
          content: { text/event-stream: { schema: { type: string } } }

  /api/v1/collections:
    get:
      summary: List collections
      tags: [Library]
      responses:
        '200': { description: Collections, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Collection' } } } } }
    post:
      summary: Create a collection
      tags: [Library]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CollectionInput' } } } }
      responses:
        '201': { description: Created collection, content: { application/json: { schema: { $ref: '#/components/schemas/Collection' } } } }

  /api/v1/collections/{collectionId}:
    parameters: [{ $ref: '#/components/parameters/CollectionID' }]
    get:
      summary: Get a collection
      tags: [Library]
      responses: { '200': { description: Collection, content: { application/json: { schema: { $ref: '#/components/schemas/Collection' } } } }, '404': { description: Not found } }
    patch:
      summary: Rename or describe a collection
      tags: [Library]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CollectionInput' } } } }
      responses: { '200': { description: Updated collection, content: { application/json: { schema: { $ref: '#/components/schemas/Collection' } } } } }
    delete:
      summary: Delete a collection
      tags: [Library]
      responses: { '204': { description: Deleted } }

  /api/v1/collections/{collectionId}/media:
    get:
      summary: List media in a collection
      tags: [Library]
      parameters:
        - $ref: '#/components/parameters/CollectionID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { description: Media, headers: { X-Next-Cursor: { $ref: '#/components/headers/NextCursor' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Media' } } } } }

  /api/v1/collections/{collectionId}/media/{mediaId}:
    parameters:
      - $ref: '#/components/parameters/CollectionID'
      - name: mediaId
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Add media to a collection
      tags: [Library]
      responses: { '204': { description: Added } }
    delete:
      summary: Remove media from a collection
      tags: [Library]
      responses: { '204': { description: Removed } }

  /api/v1/history:
    get:
      summary: List reading history
      tags: [Library]
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { description: History, headers: { X-Next-Cursor: { $ref: '#/components/headers/NextCursor' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } } } } }

  /api/v1/history/{chapterId}:
    parameters:
      - name: chapterId
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Save reading progress
      tags: [Library]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HistoryInput' } } } }
      responses: { '200': { description: Saved progress, content: { application/json: { schema: { $ref: '#/components/schemas/HistoryEntry' } } } } }
    delete:
      summary: Remove a history entry
      tags: [Library]
      responses: { '204': { description: Removed } }

  /api/v1/downloads:
    get:
      summary: List manga chapters saved in storage
      tags: [Library]
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { description: Downloads, headers: { X-Next-Cursor: { $ref: '#/components/headers/NextCursor' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Download' } } } } }

  /api/v1/downloads/{chapterId}:
    delete:
      summary: Remove the stored images for a chapter
      tags: [Library]
      parameters:
        - name: chapterId
          in: path
          required: true
          schema: { type: string }
      responses: { '204': { description: Download removed } }

  /api/v1/challenges/{token}:
    get:
      summary: Open the temporary human-action controller
      operationId: openHumanChallenge
      tags: [Browser]
      parameters:
        - $ref: '#/components/parameters/ChallengeToken'
      responses:
        '200':
          description: Same-origin HTML controller for the isolated browser session
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            text/html:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/ChallengeNotFound'
        '410':
          $ref: '#/components/responses/ChallengeExpired'
    delete:
      summary: Cancel a pending human-verification session
      operationId: cancelHumanChallenge
      tags: [Browser]
      parameters:
        - $ref: '#/components/parameters/ChallengeToken'
      responses:
        '204':
          description: Challenge cancelled
        '404':
          $ref: '#/components/responses/ChallengeNotFound'
        '410':
          $ref: '#/components/responses/ChallengeExpired'

  /api/v1/challenges/{token}/status:
    get:
      summary: Get the state and expiry of a human-verification session
      operationId: getHumanChallengeStatus
      tags: [Browser]
      parameters:
        - $ref: '#/components/parameters/ChallengeToken'
      responses:
        '200':
          description: Current challenge state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeStatus'
        '404':
          $ref: '#/components/responses/ChallengeNotFound'

  /api/v1/challenges/{token}/complete:
    post:
      summary: Ask the backend to verify and resume a human action
      description: Completion succeeds only after the backend confirms that the interactive challenge or login is no longer visible. The extraction worker then reopens the originally requested URL.
      operationId: completeHumanChallenge
      tags: [Browser]
      parameters:
        - $ref: '#/components/parameters/ChallengeToken'
      responses:
        '200':
          description: Challenge verified and extraction resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeStatus'
        '409':
          description: The challenge is still visible or is in an incompatible state
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/ChallengeNotFound'
        '410':
          $ref: '#/components/responses/ChallengeExpired'

  /api/v1/challenges/{token}/ws:
    get:
      summary: Upgrade to the same-origin browser screencast WebSocket
      description: Binary messages are JPEG frames; client messages are validated viewport, pointer, wheel, and keyboard input events.
      operationId: streamHumanChallenge
      tags: [Browser]
      parameters:
        - $ref: '#/components/parameters/ChallengeToken'
      responses:
        '101':
          description: WebSocket protocol switched
        '403':
          description: Cross-origin WebSocket request rejected
        '404':
          $ref: '#/components/responses/ChallengeNotFound'
        '409':
          description: Another controller is already connected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    JobID:
      name: jobID
      in: path
      required: true
      schema: { type: string }
    CollectionID:
      name: collectionId
      in: path
      required: true
      schema: { type: string }
    ModelKey:
      name: modelKey
      in: path
      required: true
      schema: { type: string, enum: [tiny, default, quality] }
    ChallengeToken:
      name: token
      in: path
      required: true
      description: Opaque, short-lived, single-purpose browser capability token
      schema:
        type: string
        format: uuid

  headers:
    NextCursor:
      description: Opaque cursor for the next page; absent on the last page.
      schema: { type: string }

  responses:
    ChallengeNotFound:
      description: Challenge token not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ChallengeExpired:
      description: Challenge expired or was cancelled
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details for HTTP APIs
      properties:
        type:
          type: string
          format: uri
          default: "about:blank"
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
      required:
        - title
        - status

    Capability:
      type: object
      properties:
        name:
          type: string
        available:
          type: boolean
      required:
        - name
        - available

    ChallengeStatus:
      type: object
      properties:
        status:
          type: string
          enum: [pending, verifying, completed, cancelled, expired]
        kind:
          type: string
          enum: [challenge, login]
          description: Human action that must be completed in the isolated browser session.
        connected:
          type: boolean
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
      required: [status, kind, connected, created_at, expires_at]

    CapabilitiesResponse:
      type: object
      properties:
        profile:
          type: string
          enum: [portable, docker]
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
      required:
        - profile
        - capabilities

    Media:
      type: object
      properties:
        id:
          type: string
        source_url:
          type: string
          format: uri
        type:
          type: string
          enum: [manga, manhwa, comic, novel, anime, unknown]
        title:
          type: string
        alternative_titles:
          type: array
          items:
            type: string
        description:
          type: string
        cover_url:
          type: string
        authors:
          type: array
          items:
            type: string
        artists:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [ongoing, completed, hiatus, cancelled, unknown]
        genres:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - type
        - title
        - alternative_titles
        - authors
        - artists
        - status
        - genres
        - created_at
        - updated_at

    MediaCreateRequest:
      type: object
      properties:
        source_url:
          type: string
          format: uri
        type:
          type: string
          enum: [manga, manhwa, comic, novel, anime, unknown]
        title:
          type: string
        alternative_titles:
          type: array
          items:
            type: string
        description:
          type: string
        cover_url:
          type: string
        authors:
          type: array
          items:
            type: string
        artists:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [ongoing, completed, hiatus, cancelled, unknown]
        genres:
          type: array
          items:
            type: string
      required:
        - type
        - title

    ChapterImage:
      type: object
      properties:
        position: { type: integer, minimum: 1 }
        url:
          type: string
          description: Local Shiori URL for the stored manga page image
        content_type: { type: string }
      required: [position, url]

    Chapter:
      type: object
      properties:
        id: { type: string }
        media_id: { type: string }
        number: { type: string }
        title: { type: string }
        source_url: { type: string, format: uri }
        video_url:
          type: string
          format: uri
          description: Remote video/player URL for anime; Shiori does not download the video
        images:
          type: array
          items: { $ref: '#/components/schemas/ChapterImage' }
        created_at: { type: string, format: date-time }
      required: [id, media_id, number, title, source_url, images, created_at]

    AIModel:
      type: object
      properties:
        key:
          type: string
          enum: [tiny, default, quality]
          description: The alias key used in Shiori
        name:
          type: string
          description: The actual model name configured
        is_loaded:
          type: boolean
          description: Whether the model is currently loaded in LM Studio memory
      required:
        - key
        - name
        - is_loaded

    Collection:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, description, created_at, updated_at]
    CollectionInput:
      type: object
      properties: { name: { type: string }, description: { type: string } }
      required: [name]
    HistoryEntry:
      type: object
      properties:
        chapter_id: { type: string }
        media_id: { type: string }
        title: { type: string }
        number: { type: string }
        position: { type: integer, minimum: 0 }
        progress: { type: number, minimum: 0, maximum: 1 }
        completed: { type: boolean }
        updated_at: { type: string, format: date-time }
      required: [chapter_id, media_id, title, number, position, progress, completed, updated_at]
    HistoryInput:
      type: object
      properties:
        position: { type: integer, minimum: 0 }
        progress: { type: number, minimum: 0, maximum: 1 }
        completed: { type: boolean }
      required: [position, progress, completed]
    Download:
      type: object
      properties:
        chapter_id: { type: string }
        media_id: { type: string }
        title: { type: string }
        number: { type: string }
        image_count: { type: integer }
        status: { type: string, const: completed }
        created_at: { type: string, format: date-time }
      required: [chapter_id, media_id, title, number, image_count, status, created_at]
    Job:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        status: { type: string, enum: [queued, running, requires_user_action, retry_scheduled, succeeded, succeeded_with_warnings, failed, cancelled] }
        attempts: { type: integer }
        max_attempts: { type: integer }
        error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, type, status]
