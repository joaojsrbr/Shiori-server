services:
  shiori-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SHIORI_PROFILE=docker
      - SHIORI_POSTGRES_URL=postgres://shiori:shiori_pass@postgres:5432/shiori?sslmode=disable
      - SHIORI_VALKEY_ADDR=valkey:6379
      - SHIORI_MINIO_ENDPOINT=minio:9000
      - SHIORI_MINIO_ACCESS_KEY=shiori_admin
      - SHIORI_MINIO_SECRET_KEY=shiori_secret_pass
      - SHIORI_MINIO_BUCKET=shiori-storage
      - SHIORI_MINIO_USE_SSL=false
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - shiori-net

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=shiori
      - POSTGRES_PASSWORD=shiori_pass
      - POSTGRES_DB=shiori
    volumes:
      - shiori-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiori -d shiori"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shiori-net

  valkey:
    image: valkey/valkey:7.2-alpine
    volumes:
      - shiori-valkey-data:/data
    networks:
      - shiori-net

  minio:
    image: minio/minio:RELEASE.2024-03-05T04-48-44Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=shiori_admin
      - MINIO_ROOT_PASSWORD=shiori_secret_pass
    volumes:
      - shiori-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shiori-net

volumes:
  shiori-postgres-data:
  shiori-valkey-data:
  shiori-minio-data:

networks:
  shiori-net:
    driver: bridge
